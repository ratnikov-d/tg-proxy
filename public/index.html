<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freedom</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",Arial,sans-serif; }
body {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  overflow:hidden; color:#fff;
  background:linear-gradient(-45deg, #0a1e3f, #0e3a6e, #1565c0, #4fc3f7, #0a2e5c);
  background-size:400% 400%;
  animation:gradientShift 12s ease infinite;
}
.grid {
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background-image:linear-gradient(rgba(79,195,247,.07) 1px,transparent 1px),
  linear-gradient(90deg,rgba(79,195,247,.07) 1px,transparent 1px);
  background-size:42px 42px;
}
.glow { position:fixed; border-radius:50%; filter:blur(90px); z-index:1; pointer-events:none; animation:pulse 9s ease-in-out infinite; }
.g1 { width:420px; height:420px; background:#1565c0; top:-120px; left:-100px; }
.g2 { width:360px; height:360px; background:#0288d1; bottom:-100px; right:-80px; animation-delay:4s; }
@keyframes gradientShift {
  0%   { background-position:0% 50% }
  50%  { background-position:100% 50% }
  100% { background-position:0% 50% }
}
@keyframes pulse { 0%,100% { transform:scale(1); opacity:.3 } 50% { transform:scale(1.25); opacity:.45 } }
.card {
  position:relative; z-index:10; width:360px; max-width:90vw;
  background:rgba(10,30,60,.55); backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(79,195,247,.35); border-radius:18px;
  padding:42px 36px; text-align:center;
  box-shadow:0 18px 45px rgba(0,10,40,.6), 0 0 30px rgba(21,101,192,.25);
}
h1 { font-family:Consolas,"Courier New",monospace; font-size:34px; letter-spacing:6px; font-weight:600; margin-bottom:6px; text-shadow:0 0 18px rgba(79,195,247,.8); }
.sub { font-size:13px; opacity:.8; margin-bottom:28px; letter-spacing:1px; }
.group { text-align:left; margin-bottom:18px; }
label { display:block; font-size:12px; letter-spacing:1px; margin-bottom:6px; opacity:.85; text-transform:uppercase; }
input {
  width:100%; padding:12px 14px; border-radius:10px; font-size:15px; color:#fff;
  border:1px solid rgba(79,195,247,.4); background:rgba(255,255,255,.08); outline:none;
  transition:border-color .25s, box-shadow .25s;
}
input::placeholder { color:rgba(255,255,255,.45); }
input:focus { border-color:#4fc3f7; box-shadow:0 0 0 3px rgba(79,195,247,.25); }
.btn {
  width:100%; margin-top:8px; padding:13px; border:none; border-radius:10px;
  background:linear-gradient(90deg,#1e88e5,#4fc3f7); color:#fff; font-size:15px;
  font-weight:600; letter-spacing:2px; text-transform:uppercase; cursor:pointer;
  transition:filter .25s, box-shadow .25s;
}
.btn:hover { filter:brightness(1.15); box-shadow:0 8px 22px rgba(79,195,247,.45); }
.err {
  display:none; margin-top:18px; padding:11px 14px; border-radius:10px; font-size:14px;
  background:rgba(255,82,82,.18); border:1px solid rgba(255,138,128,.55); color:#ffcdd2;
}
.err.show { display:block; animation:shake .4s ease; }
@keyframes shake { 0%,100% { transform:translateX(0) } 20% { transform:translateX(-7px) } 40% { transform:translateX(7px) } 60% { transform:translateX(-4px) } 80% { transform:translateX(4px) } }
@media (prefers-reduced-motion: reduce) { body { animation:none } .glow { animation:none } }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>

<main class="card">
  <h1>Freedom</h1>
  <p class="sub">Вход в систему</p>

  <form id="loginForm" novalidate>
    <div class="group">
      <label for="login">Логин</label>
      <input type="text" id="login" name="login" placeholder="Введите логин" autocomplete="username" required>
    </div>
    <div class="group">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" placeholder="Введите пароль" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Войти</button>
  </form>

  <div id="errorBox" class="err" role="alert" aria-live="assertive"></div>
</main>
<script>
const _c = [1053,1077,1074,1077,1088,1085,1099,1081,32,1083,1086,1075,1080,1085,32,1080,1083,1080,32,1087,1072,1088,1086,1083,1100];
const _d = (a) => a.map(n => String.fromCharCode(n)).join('');

document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const box = document.getElementById('errorBox');
  box.textContent = _d(_c);
  box.classList.remove('show');
  void box.offsetWidth;
  box.classList.add('show');
});
</script>
</body>
</html>
