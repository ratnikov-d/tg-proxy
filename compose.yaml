networks:
  shared-net:
    external: true

configs:
  telemt_config:
    file: ./telemt.toml

services:
  tproxy-web:
    container_name: tproxy-web
    build: .
    restart: unless-stopped
    networks:
      - shared-net
    volumes:
      - ./config.template.json:/tmp/tproxy/config.template.json:ro
      - ./profiles.template.json:/tmp/tproxy/profiles.template.json:ro
      - ./public:/app/public:ro
      - tproxy-state:/etc/tproxy-server
    environment:
      - MTP_SECRET=${MTP_SECRET:?MTP_SECRET must be set in .env}
      - PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME must be set in .env}
    labels:
      - "traefik.enable=true"
      # --- HTTP Router для сайта-заглушки ---
      - "traefik.http.routers.tproxy-web.rule=Host(`${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME must be set in .env}`)"
      - "traefik.http.routers.tproxy-web.entrypoints=websecure"
      - "traefik.http.routers.tproxy-web.tls=true"
      - "traefik.http.routers.tproxy-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.tproxy-web.loadbalancer.server.port=8082"
      - "traefik.docker.network=shared-net"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8082/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          memory: 128M

  # Бэкенд — telemt (Rust) вместо официального MTProxy 0.01 (образ 2020 года).
  # Сеть: alias `mtproxy`, чтобы start.sh в tproxy-web продолжал ходить в mtproxy:443.
  telemt:
    container_name: telemt
    image: ghcr.io/telemt/telemt:3.5.17
    restart: unless-stopped
    working_dir: /run/telemt
    command: ["/etc/telemt/config.toml"]
    configs:
      - source: telemt_config
        target: /etc/telemt/config.toml
    tmpfs:
      - /run/telemt:rw,mode=1777,size=8m
    networks:
      shared-net:
        aliases:
          - mtproxy
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 262144
    healthcheck:
      test: ["CMD", "/app/telemt", "healthcheck", "/etc/telemt/config.toml", "--mode", "liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  tproxy-state:
